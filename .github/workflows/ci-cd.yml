name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force generate and publish release assets'
        required: false
        type: boolean
        default: false
      custom_version:
        description: 'Custom version override (e.g. 0.3.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # -------------------------------------------------------------
  # Job 1: CI Verification (Build & Test on Windows)
  # -------------------------------------------------------------
  ci-checks:
    name: Build & Test Verification
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version_calc.outputs.version }}
      should_release: ${{ steps.version_calc.outputs.should_release }}

    steps:
      - name: Checkout Code (with full git history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Solution
        run: dotnet restore Browy.sln

      - name: Build Solution (Release)
        run: dotnet build Browy.sln -c Release --no-restore

      - name: Run Test Suite
        run: dotnet test Browy.sln -c Release --no-build --verbosity normal

      - name: Calculate Semantic Version
        id: version_calc
        shell: pwsh
        run: |
          # 1. Determine base version
          $customVer = "${{ github.event.inputs.custom_version }}"
          $baseVer = "0.3.0"

          if ($customVer) {
              $baseVer = $customVer.Trim()
          } elseif (Test-Path 'VERSION') {
              $baseVer = (Get-Content 'VERSION').Trim()
          } elseif (Test-Path 'Directory.Build.props') {
              [xml]$props = Get-Content 'Directory.Build.props'
              if ($props.Project.PropertyGroup.VersionPrefix) {
                  $baseVer = $props.Project.PropertyGroup.VersionPrefix.Trim()
              }
          }

          Write-Host "Determined Base Version: $baseVer"

          # 2. Check if triggered by tag or version change
          $shouldRelease = "false"

          if ($env:GITHUB_REF_TYPE -eq 'tag' -or $env:GITHUB_REF -like 'refs/tags/v*') {
              $tagVer = $env:GITHUB_REF_NAME.TrimStart('v')
              Write-Host "Triggered by tag: $env:GITHUB_REF_NAME -> Version $tagVer"
              $baseVer = $tagVer
              $shouldRelease = "true"
          } elseif ('${{ github.event.inputs.force_release }}' -eq 'true') {
              Write-Host "Manual dispatch with force_release=true"
              $shouldRelease = "true"
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
              $hasParent = $false
              try {
                  $parentHash = git rev-parse --verify --quiet "HEAD~1" 2>$null
                  $hasParent = [bool]$parentHash
              } catch { }
              $global:LASTEXITCODE = 0

              if ($hasParent) {
                  try {
                      $prevVersionFile = $(git show HEAD~1:VERSION 2>$null) | Out-String
                      $global:LASTEXITCODE = 0
                      if ($prevVersionFile -and $prevVersionFile.Trim() -ne "" -and $prevVersionFile.Trim() -ne $baseVer) {
                          Write-Host "VERSION file changed from '$($prevVersionFile.Trim())' to '$baseVer'!"
                          $shouldRelease = "true"
                      } else {
                          $prevProps = $(git show HEAD~1:Directory.Build.props 2>$null) | Out-String
                          $global:LASTEXITCODE = 0
                          if ($prevProps -and $prevProps.Trim() -ne "") {
                              try {
                                  [xml]$pXml = $prevProps
                                  $prevPrefix = $pXml.Project.PropertyGroup.VersionPrefix
                                  if ($prevPrefix -and $prevPrefix.Trim() -ne $baseVer) {
                                      Write-Host "Directory.Build.props VersionPrefix changed from '$prevPrefix' to '$baseVer'!"
                                      $shouldRelease = "true"
                                  }
                              } catch { }
                          }
                      }
                  } catch { }
                  $global:LASTEXITCODE = 0
              }
          }

          Write-Host "Release required: $shouldRelease (Target Version: $baseVer)"
          "version=$baseVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "should_release=$shouldRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $global:LASTEXITCODE = 0
          exit 0

  # -------------------------------------------------------------
  # Job 2: Build, Package & Release (Only on Version Bump / Tag)
  # -------------------------------------------------------------
  build-and-release:
    name: Package & Publish Windows Binaries
    needs: ci-checks
    if: needs.ci-checks.outputs.should_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Solution
        run: dotnet restore Browy.sln

      - name: Publish Standard Windows x64 Binary
        shell: pwsh
        run: |
          $ver = "${{ needs.ci-checks.outputs.version }}"
          Write-Host "Publishing Browy standard release v$ver..."
          dotnet publish src/Browy/Browy.csproj -c Release -r win-x64 --self-contained false -p:Version=$ver -p:AssemblyVersion=$ver.0 -p:FileVersion=$ver.0 -o publish/win-x64/

      - name: Publish Portable Single-File Binary
        shell: pwsh
        run: |
          $ver = "${{ needs.ci-checks.outputs.version }}"
          Write-Host "Publishing Browy portable release v$ver..."
          dotnet publish src/Browy/Browy.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$ver -p:AssemblyVersion=$ver.0 -p:FileVersion=$ver.0 -o publish/portable/

      - name: Package Release Archives & Generate Checksums
        shell: pwsh
        run: |
          $ver = "${{ needs.ci-checks.outputs.version }}"
          $stdZip = "Browy-v$ver-win-x64.zip"
          $portableZip = "Browy-v$ver-win-x64-portable.zip"

          Write-Host "Archiving standard release to $stdZip..."
          Compress-Archive -Path publish/win-x64/* -DestinationPath $stdZip -Force

          Write-Host "Archiving portable release to $portableZip..."
          Compress-Archive -Path publish/portable/* -DestinationPath $portableZip -Force

          # Generate SHA256 checksums
          $stdHash = (Get-FileHash -Path $stdZip -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash -Path $portableZip -Algorithm SHA256).Hash.ToLower()

          $checksums = @"
          $stdHash  $stdZip
          $portableHash  $portableZip
          "@.Trim()

          Set-Content -Path SHA256SUMS.txt -Value $checksums
          Write-Host "Generated SHA256SUMS.txt:`n$checksums"

      - name: Upload GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Browy-v${{ needs.ci-checks.outputs.version }}-binaries
          path: |
            Browy-v*.zip
            SHA256SUMS.txt
          retention-days: 60

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.ci-checks.outputs.version }}
          name: Browy v${{ needs.ci-checks.outputs.version }}
          files: |
            Browy-v*.zip
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # Job 3: Deploy Product Landing Page to GitHub Pages
  # -------------------------------------------------------------
  deploy-landing-page:
    name: Deploy Product Landing Page (www/)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: ci-checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies & Build Landing Page
        run: |
          cd www
          bun install --frozen-lockfile
          bun run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'www/dist/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
